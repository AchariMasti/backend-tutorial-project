$kind: http-request
url: "{{baseUrl}}/api/posts/{{postId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated post title",
      "content": "This post was updated using the PATCH endpoint."
    }
scripts:
  - type: afterResponse
    code: pm.test('Post updated', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000
